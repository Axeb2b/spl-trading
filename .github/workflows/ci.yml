name: CI

# Run on every branch push and on every pull request. (The remote's default
# branch is feat/local-backend-and-ui-redesign, so the previous master-only
# triggers meant these checks never ran on GitHub.)
on:
  push:
    branches:
      - "**"
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check
