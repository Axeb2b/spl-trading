# Deploy to Cloudflare Workers — FALLBACK path.
#
# Preferred production deploy path: Cloudflare Workers Builds, connected in the
# Cloudflare dashboard. It builds the repo on push and injects the API token
# automatically — no GitHub secrets are required for that path, and it is free
# tier (no payment method anywhere in this setup).
#
# THIS workflow is the FALLBACK path, used if/when GitHub Actions should deploy
# instead. It is gated and stays green while unconfigured: the repository
# currently has NO secrets, so the `deploy` job is SKIPPED (not failed).
#
# Secrets required to activate this workflow (repo Settings > Secrets and
# variables > Actions) — reference names only, values live only in GitHub:
#   CLOUDFLARE_API_TOKEN  - custom API token with "Workers Edit" + "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account id
#
# Branch note: the push trigger below targets `master`, but the remote's current
# default branch is `feat/local-backend-and-ui-redesign` (master exists locally
# only and is behind). Once the branch strategy is finalized, set this branch —
# and the production branch in Workers Builds — to match wherever deploys are
# cut from. This file alone does not deploy anything.

name: Deploy (Cloudflare Workers, fallback)

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time per ref; don't cancel an in-flight deploy mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

  # Secret guard: expose "are the deploy secrets configured?" as a job output.
  #
  # Why a probe job instead of `if: secrets.X != ''` on the deploy job: the
  # `secrets` context is NOT in GitHub's documented context-availability list
  # for `jobs.<job_id>.if` (that slot allows github/needs/vars/inputs), so
  # referencing it there is unreliable/invalid. The portable pattern is:
  # map secrets into a step `env` (always allowed), test them in shell, write a
  # boolean to $GITHUB_OUTPUT, then gate the deploy job with the `needs`
  # context — which IS available at job level. Missing secrets resolve to empty
  # strings, so this job succeeds and emits `enabled=false`; a false `if`
  # SKIPS the deploy job, and skipped jobs do not fail the workflow.
  # Secret values are never echoed or printed, and shell tracing is never enabled.
  probe-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Check whether deploy secrets are configured
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [checks, probe-secrets]
    if: ${{ needs.probe-secrets.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Schema first: wrangler resolves migrations_dir from wrangler.jsonc and
      # looks `spl` up by database_name/binding. In CI (GitHub Actions sets
      # CI=true, non-interactive) wrangler v4 auto-skips its confirmation prompt
      # — there is no --yes flag on this command; --remote targets the real
      # (non-wrangler-dev) database. Wrangler auth/account come from the env
      # block below (wrangler reads CLOUDFLARE_API_TOKEN/..._ACCOUNT_ID natively).
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply spl --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # npm run deploy = opennextjs-cloudflare build && opennextjs-cloudflare deploy
      - name: Build and deploy worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
